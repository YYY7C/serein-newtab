name: Bug report
description: 报告一个可以复现的问题
title: '[Bug] '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请先确认：使用最新版本、在扩展环境（不是本地 HTTP 预览）中复现过。
        本地预览没有 host 权限，天气/联想/壁纸的网络失败是预期行为。
  - type: input
    id: version
    attributes:
      label: Serein 版本
      placeholder: 1.3.2（设置 → 关于，或 manifest.json）
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: 浏览器与版本
      placeholder: Chrome 158 / Edge 157
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开设置 → ...
        2. 点击 ...
        3. 看到 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 如果有控制台报错，请一并粘贴（扩展页右键 → 检查）。
    validations:
      required: true
  - type: dropdown
    id: multitab
    attributes:
      label: 是否同时打开了多个新标签页
      options:
        - '否'
        - '是'
        - 不确定
  - type: textarea
    id: extra
    attributes:
      label: 截图或补充信息
      description: 可直接拖入图片。
