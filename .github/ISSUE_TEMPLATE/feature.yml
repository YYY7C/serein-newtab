name: Feature request
description: 提出一个功能或改进建议
title: '[Feature] '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的具体问题
      description: 描述使用场景，而不是只写功能名。
      placeholder: 每次打开新标签页都要……，希望能……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 首屏（时钟/搜索/网格）
        - 快捷方式与文件夹
        - 壁纸与视觉风格
        - 小组件
        - 设置与数据
        - 其它
  - type: checkboxes
    id: constraints
    attributes:
      label: 约束确认
      options:
        - label: 方案不引入账号、云同步或广告
          required: true
        - label: 方案不破坏零构建、零运行时依赖
          required: true
